[project]
name = "niyam-backend"
version = "0.1.0"
description = "Niyam AI — GST pre-filing intelligence platform (P1 MVP backend)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "email-validator>=2.0",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "rq>=1.16",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "orjson>=3.10",
    "zxcvbn>=4.4.28",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
    "pdfminer.six>=20240706",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "rls: tests that verify Row-Level Security isolation",
    "engine: reconciliation/validation engine tests",
]
