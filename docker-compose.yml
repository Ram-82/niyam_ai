# Every value that a real deployment would rotate is env-parameterised
# with a dev default (``${VAR:-value}``). Docker Compose reads the
# process environment plus a .env file next to this file if present; a
# secrets manager can render that .env at deploy time. Nothing in this
# file needs editing to swap credentials.
#
# See .env.example for the canonical list of variables the app reads.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-niyam}
      POSTGRES_USER: ${POSTGRES_USER:-niyam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niyam}
    ports:
      - "5432:5432"
    volumes:
      - niyam_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-niyam} -d ${POSTGRES_DB:-niyam}"
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Python 3.11 CLI for alembic/pytest/uvicorn etc.
  # Runs via `docker compose run --rm backend <cmd>` — the "cli" profile
  # keeps it out of `docker compose up`.
  backend:
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - niyam_uploads:/data/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://niyam:niyam@postgres:5432/niyam}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://niyam:niyam@postgres:5432/niyam}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-in-prod}
      UPLOAD_DIR: /data/uploads
      GSP_MODE: ${GSP_MODE:-mock}
      GSP_BASE_URL: ${GSP_BASE_URL:-http://gsp-mock:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["cli"]

  # RQ worker for the imports queue. Same image + shared upload volume as
  # backend so it can read the files that upload_invoices/gstr2b wrote.
  worker:
    build: ./backend
    working_dir: /app
    command: python -m app.workers.worker
    volumes:
      - ./backend:/app
      - niyam_uploads:/data/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://niyam:niyam@postgres:5432/niyam}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://niyam:niyam@postgres:5432/niyam}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-in-prod}
      UPLOAD_DIR: /data/uploads
      GSP_MODE: ${GSP_MODE:-mock}
      GSP_BASE_URL: ${GSP_BASE_URL:-http://gsp-mock:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # FastAPI dev server exposing the backend HTTP surface for the
  # frontend + Playwright. Sync launched with docker compose up.
  api:
    build: ./backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - niyam_uploads:/data/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://niyam:niyam@postgres:5432/niyam}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://niyam:niyam@postgres:5432/niyam}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-in-prod}
      UPLOAD_DIR: /data/uploads
      GSP_MODE: ${GSP_MODE:-mock}
      GSP_BASE_URL: ${GSP_BASE_URL:-http://gsp-mock:9000}
      # Enable the P2 modules for dev + e2e. Both use mock transports
      # (deterministic template narration, in-memory wamid.mock ids)
      # so no external calls fire.
      NARRATOR_ENABLED: ${NARRATOR_ENABLED:-1}
      NARRATOR_MODE: ${NARRATOR_MODE:-mock}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-1}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-mock}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Local mock of a GSP (GST Suvidha Provider). See app/gsp/mock_server.py.
  # First-class citizen — every automated e2e / integration test hits this
  # until we hold real GSP sandbox credentials. Same image as backend so
  # it always has the fixtures under /app/app/gsp/fixtures.
  gsp-mock:
    build: ./backend
    working_dir: /app
    command: uvicorn app.gsp.mock_server:app --host 0.0.0.0 --port 9000
    volumes:
      - ./backend:/app
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health').read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Next.js dev server.
  frontend:
    build: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - niyam_node_modules:/app/node_modules
    environment:
      NIYAM_API_BASE: ${NIYAM_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  niyam_pg:
  niyam_uploads:
  niyam_node_modules:
