services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: niyam
      POSTGRES_USER: niyam
      POSTGRES_PASSWORD: niyam
    ports:
      - "5432:5432"
    volumes:
      - niyam_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyam -d niyam"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Python 3.11 CLI for alembic/pytest/uvicorn etc.
  # Runs via `docker compose run --rm backend <cmd>` — the "cli" profile
  # keeps it out of `docker compose up`.
  backend:
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - niyam_uploads:/data/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://niyam:niyam@postgres:5432/niyam
      APP_DATABASE_URL: postgresql+psycopg://niyam:niyam@postgres:5432/niyam
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["cli"]

  # RQ worker for the imports queue. Same image + shared upload volume as
  # backend so it can read the files that upload_invoices/gstr2b wrote.
  worker:
    build: ./backend
    working_dir: /app
    command: python -m app.workers.worker
    volumes:
      - ./backend:/app
      - niyam_uploads:/data/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://niyam:niyam@postgres:5432/niyam
      APP_DATABASE_URL: postgresql+psycopg://niyam:niyam@postgres:5432/niyam
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # FastAPI dev server exposing the backend HTTP surface for the
  # frontend + Playwright. Sync launched with docker compose up.
  api:
    build: ./backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - niyam_uploads:/data/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://niyam:niyam@postgres:5432/niyam
      APP_DATABASE_URL: postgresql+psycopg://niyam:niyam@postgres:5432/niyam
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js dev server.
  frontend:
    build: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - niyam_node_modules:/app/node_modules
    environment:
      NIYAM_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  niyam_pg:
  niyam_uploads:
  niyam_node_modules:
