# Readiness-run overlay for the filing-cycle walkthrough.
#
# The walkthrough must not measure the product through the Turbopack dev
# server. Dev-mode compile-on-demand, hot reload, and dev-only error
# handling are all in the measurement path and none of them exist in
# production — a transient dev compile wedge once produced a blank
# workspace that read as a product gap (see filing-cycle-walkthrough.md).
#
# This overlay swaps the frontend to a production server. The build itself
# is run as an explicit step by walkthrough-run.mjs so its output is
# captured and reported rather than disappearing into a restart loop.
#
# Used via COMPOSE_FILE, which walkthrough-run.mjs sets for every
# `docker compose` call it makes. Not part of `docker compose up` by hand.
services:
  frontend:
    command: npm run start
